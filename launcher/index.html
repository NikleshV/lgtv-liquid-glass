<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.CYTV_HOME_HOST = "card";</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <title>Home — Liquid Glass for LG webOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="homeSurface" class="lg-surface">
    <!-- Wallpaper Layer -->
    <div id="wallpaperLayer" class="wallpaper-layer"></div>
    <div id="wallpaperScrim" class="wallpaper-scrim"></div>

    <!-- Dual Crossfading Ambient Backlight Glows (sampled from focused app color) -->
    <div id="ambientA" class="ambient-glow"></div>
    <div id="ambientB" class="ambient-glow"></div>

    <!-- Top Status Bar: Left Clock/Date/Greeting, Right Frosted Pills -->
    <header id="topBar" class="top-bar">
      <div class="top-left">
        <div id="greetingText" class="greeting-text">Good evening</div>
        <div class="clock-row">
          <span id="clockTime" class="clock-time">09:41</span>
          <span id="clockPeriod" class="clock-period">PM</span>
          <span class="pill-divider"></span>
          <span id="clockDate" class="clock-date">Friday, November 6</span>
        </div>
      </div>

      <div id="topPills" class="top-pills">
        <!-- Weather Pill -->
        <button type="button" class="glass-pill" id="pillWeather" data-pill="0">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/>
          </svg>
          <span id="weatherTemp">22°C</span>
          <span id="weatherCond" class="pill-sub">Clear</span>
        </button>

        <!-- Inputs Pill -->
        <button type="button" class="glass-pill" id="pillInputs" data-pill="1">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"/>
          </svg>
          <span>Inputs</span>
        </button>

        <!-- Wi-Fi / Network Pill -->
        <button type="button" class="glass-pill" id="pillWifi" data-pill="2">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1,9l2,2c4.97,-4.97 13.03,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/>
          </svg>
          <span id="wifiLabel">Connected</span>
        </button>

        <!-- Themes & Wallpaper Pill -->
        <button type="button" class="glass-pill" id="pillThemes" data-pill="3">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
          <span>Appearance</span>
        </button>

        <!-- Settings & Debloat Pill -->
        <button type="button" class="glass-pill" id="pillSettings" data-pill="4">
          <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </header>

    <!-- Hero Spotlight Shelf above the Dock -->
    <section id="heroSpotlight" class="hero-spotlight">
      <div class="hero-content">
        <div class="hero-meta-row">
          <span id="heroCategory" class="hero-badge">Featured App</span>
          <span id="heroHint" class="hero-hint">Press OK to open · Hold OK to move or hide</span>
        </div>
        <h1 id="heroTitle" class="hero-title">Netflix</h1>
        <p id="heroSubtitle" class="hero-subtitle">Watch TV Shows &amp; Movies Online in 4K Dolby Vision</p>
      </div>
    </section>

    <!-- Main Scrollable Viewport: Liquid Glass Dock + App Grid + Spring Focus Frame -->
    <div id="viewport" class="viewport">
      <div id="stage" class="stage">
        <div id="dockBand" class="dock-band"></div>
        <div id="tilesContainer" class="tiles-container"></div>
        <div id="glassFocus" class="glass-focus"></div>
      </div>
    </div>

    <!-- Modal Overlay Panels (Inputs, Appearance/Themes, Settings/Debloat/Helper, App Library) -->
    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div id="modalCard" class="modal-card">
        <div class="modal-header">
          <div>
            <h2 id="modalTitle" class="modal-title">Panel</h2>
            <p id="modalSubtitle" class="modal-subtitle"></p>
          </div>
          <span class="modal-close-hint">Press BACK to close</span>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- Tile Action Context Menu (Hold OK) -->
    <div id="tileMenuBackdrop" class="modal-backdrop hidden">
      <div class="context-card">
        <h3 id="tileMenuTitle" class="context-title">App Options</h3>
        <div id="tileMenuList" class="context-list"></div>
      </div>
    </div>

    <!-- QNED / OLED Burn-in Safe Drifting Liquid Glass Clock Screensaver -->
    <div id="screensaverOverlay" class="screensaver-overlay hidden">
      <div id="screensaverGlow" class="screensaver-glow"></div>
      <div id="screensaverDrifter" class="screensaver-drifter">
        <div id="ssTime" class="ss-time">09:41</div>
        <div id="ssDate" class="ss-date">Friday, November 6</div>
        <div id="ssWeather" class="ss-weather">22°C · Clear Sky</div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
